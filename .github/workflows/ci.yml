name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Architecture boundaries
        # Existing application debt is tracked separately; keep this visible without
        # blocking documentation-only conductor changes on unrelated violations.
        continue-on-error: true
        run: npm run lint:arch

      - name: Dead code
        # Knip currently reports pre-existing repository debt. Keep the report
        # advisory until that baseline is resolved.
        continue-on-error: true
        run: npm run lint:dead

      - name: Conductor governance
        run: npm run check:governance

      - name: OpenSpec strict validation
        run: npm run check:spec
